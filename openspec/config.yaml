schema: spec-driven

context: |
  Product: Kairion, open-source AI-powered demand intelligence for founders.
  Status: planning/bootstrap only; do not infer runtime implementation.
  Stack: ASP.NET Core 10 API, React + TypeScript web app, PostgreSQL,
  Hangfire, Docker. Self-hosted first and BYOK; no managed AI assumption.
  Evidence rule: preserve source URLs/provenance. Application code computes
  counts and trends; AI produces typed semantic analysis, never totals.
  Opportunity signals are not business validation.
  Inspect dotnet-platform-libs before adopting AI/job packages; product and
  source semantics remain owned by Kairion.

rules:
  proposal:
    - Include the outcome boundary, package map, dependency order, sibling evidence, and non-goals.
  design:
    - Name exact .NET/TypeScript modules, contracts, persistence, errors, privacy behavior, and verification oracles.
  tasks:
    - Use BFS baseline, DFS implementation, BFS regression, and verification phases.

# Project context (optional)
# This is shown to AI when creating artifacts.
